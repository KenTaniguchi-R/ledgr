name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: [self-hosted, macmini]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write # upload Trivy SARIF to the Security tab

    steps:
      - uses: actions/checkout@v7

      # The mini's ~/.docker/config.json stores logins in the macOS Keychain
      # (credsStore: osxkeychain), which a runner service can't unlock:
      # login-action fails with "User interaction is not allowed. (-25308)".
      # Give the job its own Docker config so the token lands in a file. It
      # has to come before setup-buildx, which records its builder under
      # DOCKER_CONFIG, and has to carry over the active context's daemon and
      # the CLI plugins that the old config dir provided.
      - name: Use a job-local Docker config
        run: |
          cfg="$RUNNER_TEMP/docker-config"
          mkdir -p "$cfg"
          echo "DOCKER_HOST=$(docker context inspect --format '{{.Endpoints.docker.Host}}')" >> "$GITHUB_ENV"
          if [ -d "$HOME/.docker/cli-plugins" ]; then ln -s "$HOME/.docker/cli-plugins" "$cfg/cli-plugins"; fi
          echo '{}' > "$cfg/config.json"
          echo "DOCKER_CONFIG=$cfg" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build a single-arch image locally first so it can be scanned before publishing.
      # Layers are cached and reused by the multi-arch push below.
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ledgr:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Report all fixable HIGH/CRITICAL findings to the Security tab.
      - name: Scan image with Trivy (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ledgr:scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Gate the release: fail if a fixable CRITICAL vulnerability is present.
      - name: Scan image with Trivy (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ledgr:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
